map "$status:$scenechain_cache_kind" $scenechain_cache_control {
  default "";
  ~^[0-9]+:api$ "no-store";
  ~^(200|201|204|206|301|302|303|304|307|308):asset$ "public, immutable";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  set $scenechain_cache_kind "";

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
  add_header Cache-Control $scenechain_cache_control always;

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    set $scenechain_cache_kind api;
  }

  location / {
    try_files $uri /index.html;
  }

  location ~* \.(svg|webp|avif|png|jpe?g|js|css)$ {
    expires 1y;
    set $scenechain_cache_kind asset;
  }
}
