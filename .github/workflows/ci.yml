name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn --batch-mode verify

  frontend:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --coverage --coverage.reporter=text --coverage.reporter=lcov
      - name: Preserve scenechain-frontend coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-scenechain-frontend
          path: frontend/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7
      - name: Upload scenechain-frontend coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CODECOV_UPLOAD_ENABLED == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: false
          files: ./frontend/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true
          version: v11.3.1
          cleanup: true
      - run: npm run build
      - run: npm audit --audit-level=high

  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: docker compose config --quiet
      - run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.prod.yml config --quiet
      - run: python3 -m py_compile scripts/*.py
      - run: python3 -m unittest discover -s tests -p test_security_policy.py
      - run: sh -n scripts/*.sh
      - run: sh scripts/deploy_workflow_contract.test.sh
      - run: python3 -m json.tool protocol/schemas/credential.schema.json >/dev/null
      - run: python3 -m json.tool protocol/schemas/scene-manifest.schema.json >/dev/null
      - run: python3 -m json.tool protocol/test-vectors/credential-v1.json >/dev/null
      - run: python3 scripts/validate_scene_pack.py scene-pack/v1/manifest.json
      - run: echo "4c8b6fcccad045a4916f72a0116a01da9dfe60b63fde88c0b7b6459c938bd4d6  docs/protocol.md" | sha256sum --check -
      - run: echo "99bc78510a377e6b7712cd120a76df844a9cb311616f682aa6046047e5bdfb58  scene-pack/v1/manifest.json" | sha256sum --check -

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend, repository]
    env:
      PROTOCOL_SHA256: 4c8b6fcccad045a4916f72a0116a01da9dfe60b63fde88c0b7b6459c938bd4d6
      MANIFEST_SHA256: 99bc78510a377e6b7712cd120a76df844a9cb311616f682aa6046047e5bdfb58
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6
        with:
          source: .
          files: docker-compose.yml
          targets: backend,frontend
          load: true
          set: |
            backend.cache-from=type=gha,scope=scenechain-backend
            backend.cache-to=type=gha,mode=max,scope=scenechain-backend
            backend.tags=scenechain-backend:latest
            frontend.cache-from=type=gha,scope=scenechain-frontend
            frontend.cache-to=type=gha,mode=max,scope=scenechain-frontend
            frontend.tags=scenechain-frontend:latest
      - name: Record the built image identities
        run: |
          backend_image_id=$(docker image inspect --format '{{.Id}}' scenechain-backend:latest)
          frontend_image_id=$(docker image inspect --format '{{.Id}}' scenechain-frontend:latest)
          printf 'CI_BUILT_BACKEND_ID=%s\n' "$backend_image_id" >> "$GITHUB_ENV"
          printf 'CI_BUILT_FRONTEND_ID=%s\n' "$frontend_image_id" >> "$GITHUB_ENV"
      - uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: scenechain-backend:latest
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          grype-version: v0.112.0
          output-format: table
      - run: docker compose up -d --no-build
      - name: Verify initial application image identities
        run: |
          test "$(docker inspect --format '{{.Image}}' "$(docker compose ps -q backend)")" = "$CI_BUILT_BACKEND_ID"
          test "$(docker inspect --format '{{.Image}}' "$(docker compose ps -q frontend)")" = "$CI_BUILT_FRONTEND_ID"
      - run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8088/api/pack/status; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - run: sh ./scripts/security_negative_test.sh
      - name: Open a disposable local-only release gate
        run: |
          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U scenechain -d scenechain \
            -c "UPDATE release_gate SET protocol_sha256='$PROTOCOL_SHA256', manifest_sha256='$MANIFEST_SHA256', preregistration_id='LOCAL-SMOKE-NOT-AN-APPROVAL', ethics_reference='LOCAL-SMOKE-NOT-AN-APPROVAL', data_protection_reference='LOCAL-SMOKE-NOT-AN-APPROVAL', approved_at=now(), approved_by='LOCAL-SMOKE-NOT-AN-APPROVAL', recruitment_enabled=TRUE WHERE singleton=TRUE;"
          SCENECHAIN_PROTOCOL_SHA256="$PROTOCOL_SHA256" SCENECHAIN_RECRUITMENT_ENABLED=true \
            docker compose up -d --no-build --force-recreate backend frontend
      - name: Verify gated application image identities
        run: |
          test "$(docker inspect --format '{{.Image}}' "$(docker compose ps -q backend)")" = "$CI_BUILT_BACKEND_ID"
          test "$(docker inspect --format '{{.Image}}' "$(docker compose ps -q frontend)")" = "$CI_BUILT_FRONTEND_ID"
      - name: Wait for the gated application
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8088/api/pack/status | grep -q '"recruitmentEnabled":true'; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - run: sh ./scripts/smoke_test.sh
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [containers]
    if: ${{ always() }}
    steps:
      - name: Require scanning and integration to succeed
        env:
          CONTAINERS_RESULT: ${{ needs.containers.result }}
        run: test "$CONTAINERS_RESULT" = success
