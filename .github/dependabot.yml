version: 2
updates:
- package-ecosystem: docker
  directory: /backend
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    patch-updates:
      patterns:
      - '*'
      update-types:
      - patch
- package-ecosystem: docker
  directory: /frontend
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    patch-updates:
      patterns:
      - '*'
      update-types:
      - patch
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    patch-updates:
      patterns:
      - '*'
      update-types:
      - patch
- package-ecosystem: npm
  directory: /frontend
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    patch-updates:
      patterns:
      - '*'
      update-types:
      - patch
