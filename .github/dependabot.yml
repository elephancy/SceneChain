version: 2
updates:
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 3
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 3
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    groups:
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      compatible-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 3
